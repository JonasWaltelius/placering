    function App() {
      // Hämta sparad data från localStorage eller ladda grunddata
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem('klassrum_app_data_v3');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_DATA;
      });

      const [selectedDeskId, setSelectedDeskId] = useState(null);
      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [editingStudentId, setEditingStudentId] = useState(null);
      const [isPrintMode, setIsPrintMode] = useState(false);
      const [newMonthName, setNewMonthName] = useState('');
      const [showNewMonthModal, setShowNewMonthModal] = useState(false);
      const [showNewClassModal, setShowNewClassModal] = useState(false);
      const [newClassName, setNewClassName] = useState('');
      const fileInputRef = useRef(null);

      // Spara i LocalStorage vid varje ändring
      useEffect(() => {
        try {
          localStorage.setItem('klassrum_app_data_v3', JSON.stringify(appData));
        } catch (e) {
          console.error(e);
        }
      }, [appData]);

      const currentClass = appData.classes[appData.activeClassId] || Object.values(appData.classes)[0];
      const currentMonth = currentClass.activeMonth;
      const currentSeating = currentClass.months[currentMonth] || {};
      const students = currentClass.students || [];

      // Elevkatalog för snabb uppslagning
      const studentMap = useMemo(() => {
        const map = {};
        students.forEach(s => { map[s.id] = s; });
        return map;
      }, [students]);

      // Gruppera efter Flickor och Pojkar
      const girls = useMemo(() => students.filter(s => s.gender === 'F'), [students]);
      const boys = useMemo(() => students.filter(s => s.gender === 'P'), [students]);

      // Hitta vilken bänk en elev sitter på
      const getDeskForStudent = (studentId) => {
        for (const [deskId, sId] of Object.entries(currentSeating)) {
          if (sId === studentId) return deskId;
        }
        return null;
      };

      // Uppdatera placering
      const updateSeating = (newSeatingMap) => {
        setAppData(prev => ({
          ...prev,
          classes: {
            ...prev.classes,
            [currentClass.id]: {
              ...prev.classes[currentClass.id],
              months: {
                ...prev.classes[currentClass.id].months,
                [currentMonth]: newSeatingMap
              }
            }
          }
        }));
      };

      // Klickhanterare för bänkar och högerspalt
      const handleDeskClick = (deskId) => {
        // Om en elev är markerad i högerspalten -> placera eleven här
        if (selectedStudentId) {
          const currentOccupant = currentSeating[deskId];
          const previousDesk = getDeskForStudent(selectedStudentId);

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[deskId] = selectedStudentId;

          updateSeating(updated);
          setSelectedStudentId(null);
          setSelectedDeskId(null);
          return;
        }

        // Om en bänk redan är markerad -> byt plats med klickad bänk
        if (selectedDeskId) {
          if (selectedDeskId === deskId) {
            setSelectedDeskId(null);
            return;
          }
          const s1 = currentSeating[selectedDeskId] || null;
          const s2 = currentSeating[deskId] || null;

          const updated = { ...currentSeating, [selectedDeskId]: s2, [deskId]: s1 };
          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        // Annars markera bänken
        setSelectedDeskId(deskId);
      };

      // Klick på elev i högerspalten
      const handleStudentListClick = (studentId) => {
        if (selectedDeskId) {
          // Placera vald elev i den markerade bänken direkt
          const previousDesk = getDeskForStudent(studentId);
          const currentOccupant = currentSeating[selectedDeskId];

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[selectedDeskId] = studentId;

          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        if (selectedStudentId === studentId) {
          setSelectedStudentId(null);
        } else {
          setSelectedStudentId(studentId);
        }
      };

      // Lyft ut elev ur bänk
      const handleUnseat = (studentId, e) => {
        if (e) e.stopPropagation();
        const deskId = getDeskForStudent(studentId);
        if (deskId) {
          const updated = { ...currentSeating, [deskId]: null };
          updateSeating(updated);
        }
        if (selectedStudentId === studentId) setSelectedStudentId(null);
      };

      // Beräkna statusfärg (Grön, Gul, Röd)
      const getDeskStatus = (deskId, student) => {
        if (!student) return 'empty';
        const neighborIds = (ADJACENCY[deskId] || []).map(id => currentSeating[id]).filter(Boolean);
        const neighbors = neighborIds.map(id => studentMap[id]).filter(Boolean);
        const prefs = student.prefs || {};

        // RÖD: Kollision med "Får inte sitta bredvid"
        if (prefs.avoid && prefs.avoid.some(id => neighborIds.includes(id))) {
          return 'red';
        }

        // RÖD: Särskilda behov ej uppfyllt
        if (prefs.backRow && !deskId.startsWith('r3')) return 'red';
        if (prefs.nearGroup && !['r3_1', 'r3_2', 'r2_1'].includes(deskId)) return 'red';
        if (prefs.nearDoor && !['d1', 'd2', 'r2_1'].includes(deskId)) return 'red';

        // GUL: Saknar minst 1 av samma kön (om eleven har grannar)
        if (neighbors.length > 0) {
          const hasSameGender = neighbors.some(n => n.gender === student.gender);
          if (!hasSameGender) return 'yellow';
        }

        // GUL: Önskad bänkkamrat finns men sitter inte bredvid
        if (prefs.friends && prefs.friends.length > 0) {
          const friendNextTo = prefs.friends.some(id => neighborIds.includes(id));
          if (!friendNextTo) return 'yellow';
        }

        return 'green';
      };

      // Dynamisk typografi för elevnamn så att de aldrig klipps
      const formatStudentName = (name) => {
        if (!name) return { text: '', fontSize: 'text-xs' };
        if (name.length <= 6) return { text: name, fontSize: 'text-sm font-semibold' };
        if (name.length <= 9) return { text: name, fontSize: 'text-xs font-semibold' };
        if (name.length <= 13) return { text: name, fontSize: 'text-[10px] font-semibold leading-tight' };
        return { text: name, fontSize: 'text-[9px] font-medium leading-tight' };
      };

      // Exportera och Importera backup (JSON) för iPad-flytt
      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `klassrum_backup_${appData.activeClassId}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const importBackup = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.classes) {
              setAppData(parsed);
              alert("Backup inläst!");
            }
          } catch (err) {
            alert("Kunde inte läsa in filen: Felaktigt JSON-format.");
          }
        };
        reader.readAsText(file);
      };

      // Skapa ny månad
      const handleCreateMonth = () => {
        if (!newMonthName.trim()) return;
        const name = newMonthName.trim();
        setAppData(prev => ({
          ...prev,
          classes: {
            ...prev.classes,
            [currentClass.id]: {
              ...prev.classes[currentClass.id],
              activeMonth: name,
              months: {
                ...prev.classes[currentClass.id].months,
                [name]: { ...currentSeating } // kopiera nuvarande layout som startpunkt
              }
            }
          }
        }));
        setNewMonthName('');
        setShowNewMonthModal(false);
      };

      // Skapa ny klass
      const handleCreateClass = () => {
        if (!newClassName.trim()) return;
        const id = newClassName.trim();
        setAppData(prev => ({
          ...prev,
          activeClassId: id,
          classes: {
            ...prev.classes,
            [id]: {
              id: id,
              name: id,
              activeMonth: 'Ny period',

              months: {
                'Ny period': {}

        setNewClassName('');
        setShowNewClassModal(false);

      // Bänk-komponent med skolbänksestetik
      const renderDesk = (deskId, customClass = "") => {
        const studentId = currentSeating[deskId];
        const student = studentMap[studentId];
        const isSelected = selectedDeskId === deskId;
        const status = getDeskStatus(deskId, student);

        let borderAndBg = "bg-amber-100/90 border-amber-300 text-amber-900"; // tom bänk
        if (student) {
          if (status === 'green') {
            borderAndBg = "bg-emerald-50 border-emerald-500 text-emerald-950 shadow-sm";
          } else if (status === 'yellow') {
            borderAndBg = "bg-amber-50 border-amber-500 text-amber-950 shadow-sm";
          } else if (status === 'red') {

        const nameStyle = formatStudentName(student?.name);

        return (
          <div
            key={deskId}
            onClick={() => !isPrintMode && handleDeskClick(deskId)}
            className={`
              relative flex flex-col items-center justify-center 
              h-16 w-full rounded-md border-2 transition-all cursor-pointer
              shadow-[0_2px_4px_rgba(0,0,0,0.05)]
              ${borderAndBg}
              ${isSelected ? 'ring-4 ring-blue-500 scale-[1.02] z-20' : 'hover:border-blue-400'}
              ${customClass}
            `}
          >
            {/* Pennskåra */}
            <div className="absolute top-1 left-3 right-3 h-[3px] bg-black/10 rounded-full"></div>

            {/* Elevnamn */}
            <div className="mt-1 px-1 text-center font-sans tracking-tight leading-snug">
              {student ? (
                <div className="flex flex-col items-center">
                  <span className={`${nameStyle.fontSize} line-clamp-2`}>{student.name}</span>
                  {!isPrintMode && (
                    <span className="text-[9px] font-bold opacity-60">
                      {student.gender === 'F' ? 'F' : 'P'}
                    </span>
                  )}
                </div>
              ) : (
                <span className="text-[11px] font-medium text-amber-700/40">Ledig</span>
              )}
            </div>

            {/* Färgindikator i hörnet */}
            {!isPrintMode && student && (
              <div className={`absolute bottom-1 right-1 w-2.5 h-2.5 rounded-full ${
                status === 'green' ? 'bg-emerald-500' :
                status === 'yellow' ? 'bg-amber-500' : 'bg-rose-500'
              }`} />
            )}
          </div>
        );
      };

      return (
        <div className="flex h-screen w-screen bg-slate-200 overflow-hidden font-sans">

          <div className="flex-1 flex flex-col h-full bg-slate-50 relative p-3">
            
            {/* TOPPMENY (Döljs i utskriftsläge) */}

                <div className="flex items-center gap-3">
                  <span className="font-black tracking-tight text-blue-600 text-lg">SO</span>

                  {/* Välj Klass */}
                  <select

                <div className="flex-1 grid grid-cols-5 gap-2">

                  {renderDesk('r2_2')}
                  {renderDesk('r2_3')}
                  {renderDesk('r2_4')}
                  {renderDesk('r2_5')}
                </div>

                {/* Mittgång */}
                <div className="w-6 flex items-center justify-center text-slate-300 font-bold text-xs">
                  ||
                </div>

                {/* Höger grupp (5 bänkar) */}
                <div className="flex-1 grid grid-cols-5 gap-2">
                  {renderDesk('r2_6')}
                  {renderDesk('r2_7')}
                  {renderDesk('r2_8')}
                  {renderDesk('r2_9')}
                  {renderDesk('r2_10')}
                </div>
              </div>

              {/* RAD 3: BAKRE RADEN (10 SAMMANHÄNGANDE BÄNKAR) */}
              <div className="w-full px-2 my-1">
                <div className="grid grid-cols-10 gap-2 w-full">
                  {renderDesk('r3_1')}
                  {renderDesk('r3_2')}
                  {renderDesk('r3_3')}
                  {renderDesk('r3_4')}
                  {renderDesk('r3_5')}
                  {renderDesk('r3_6')}
                  {renderDesk('r3_7')}
                  {renderDesk('r3_8')}
                  {renderDesk('r3_9')}
                  {renderDesk('r3_10')}
                </div>

                {/* Färgförklaring i botten */}

                    </span>
                    <span className="flex items-center gap-1.5">
                      <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Regelkollision
                    </span>

                <div className="w-16"></div>
              </div>
            </div>
          </div>

          {/* HÖGER SPALT: KLASSLISTA (FLICKOR & POJKAR) - Döljs i utskriftsläge */}
          {!isPrintMode && (
            <aside className="w-72 bg-white border-l border-slate-300 flex flex-col h-full shadow-lg">
              <div className="p-3 border-b border-slate-200 bg-slate-50">
                <div className="flex items-center justify-between">

                {/* FLICKOR */}
                <div>

                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

      'januari': 1, 'februari': 2, 'mars': 3, 'april': 4, 'maj': 5, 'juni': 6,

    const sortMonthsDesc = (monthsObj) => {
      const keys = Object.keys(monthsObj);
      return keys.sort((a, b) => {
        if (a === 'Tom') return 1;
        if (b === 'Tom') return -1;

        const parse = (str) => {
          const parts = str.toLowerCase().split(/\s+/);
          let year = 2026;
          let monthIdx = 0;
          for (const p of parts) {
            const num = parseInt(p, 10);
            if (!isNaN(num) && num > 1900) {
              year = num;
            } else if (MONTH_ORDER[p]) {
              monthIdx = MONTH_ORDER[p];
            }
          }
          const created = monthsObj[str]?.createdAt || 0;
          return { year, monthIdx, created };
        };

        const pa = parse(a);
        const pb = parse(b);

        if (pa.year !== pb.year) return pb.year - pa.year;
        if (pa.monthIdx !== pb.monthIdx && pa.monthIdx > 0 && pb.monthIdx > 0) {
          return pb.monthIdx - pa.monthIdx;
        }
        return pb.created - pa.created;
      });
    };

    function App() {
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem('klassrum_app_data_v11');
          if (saved) {
            const parsed = JSON.parse(saved);
            return parsed;
          }
        } catch (e) {
          console.error(e);
        }
        return INITIAL_DATA;
      });

      const [selectedDeskId, setSelectedDeskId] = useState(null);
      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [isPrintMode, setIsPrintMode] = useState(false);
      const [showClassModal, setShowClassModal] = useState(false);
      
      const [showViewMonthModal, setShowViewMonthModal] = useState(false);
      const [showSaveMonthModal, setShowSaveMonthModal] = useState(false);
      const [newMonthName, setNewMonthName] = useState('');
      
      const [showNewClassModal, setShowNewClassModal] = useState(false);
      const [newClassName, setNewClassName] = useState('');

      const [tempClassName, setTempClassName] = useState('');
      const [editingStudentId, setEditingStudentId] = useState(null);
      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentGender, setNewStudentGender] = useState('F');

      useEffect(() => {
        try {
          localStorage.setItem('klassrum_app_data_v11', JSON.stringify(appData));
        } catch (e) {
          console.error(e);
        }
      }, [appData]);

      const currentClass = appData.classes[appData.activeClassId] || Object.values(appData.classes)[0];
      const sortedMonths = useMemo(() => sortMonthsDesc(currentClass.months || {}), [currentClass.months]);
      
      const currentMonth = currentClass.activeMonth && currentClass.months[currentClass.activeMonth] 
        ? currentClass.activeMonth 
        : (sortedMonths[0] || 'Tom');

      const currentSeating = (currentClass.months && currentClass.months[currentMonth]?.seating) || {};
      const students = currentClass.students || [];

      const studentMap = useMemo(() => {
        const map = {};
        students.forEach(s => { map[s.id] = s; });
        return map;
      }, [students]);

      const girls = useMemo(() => students.filter(s => s.gender === 'F'), [students]);
      const boys = useMemo(() => students.filter(s => s.gender === 'P'), [students]);

      const getDeskForStudent = (studentId) => {
        for (const [deskId, sId] of Object.entries(currentSeating)) {
          if (sId === studentId) return deskId;
        }
        return null;
      };

      // Välj en månad -> laddar in dess sparade placering
      const selectAndOpenMonth = (mName) => {
        setAppData(prev => ({
          ...prev,
          classes: {
            ...prev.classes,
            [currentClass.id]: {

              activeMonth: mName
            }
          }
        }));
        setSelectedDeskId(null);
        setSelectedStudentId(null);
        setShowViewMonthModal(false);
      };

      // Uppdatera placering i aktiv månad
      const updateSeating = (newSeatingMap) => {
        setAppData(prev => {
          const currentMonths = prev.classes[currentClass.id].months || {};
          return {
            ...prev,
            classes: {
              ...prev.classes,
              [currentClass.id]: {
                ...prev.classes[currentClass.id],
                months: {
                  ...currentMonths,
                  [currentMonth]: {
                    seating: newSeatingMap,
                    createdAt: currentMonths[currentMonth]?.createdAt || Date.now()
                  }
                }
              }
            }
          };
        });
      };

      const handleDeskClick = (deskId) => {
        if (selectedStudentId) {
          const currentOccupant = currentSeating[deskId];
          const previousDesk = getDeskForStudent(selectedStudentId);

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[deskId] = selectedStudentId;

          updateSeating(updated);
          setSelectedStudentId(null);
          setSelectedDeskId(null);
          return;
        }

        if (selectedDeskId) {
          if (selectedDeskId === deskId) {
            setSelectedDeskId(null);
            return;
          }
          const s1 = currentSeating[selectedDeskId] || null;
          const s2 = currentSeating[deskId] || null;

          const updated = { ...currentSeating, [selectedDeskId]: s2, [deskId]: s1 };
          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        setSelectedDeskId(deskId);
      };

      const handleStudentListClick = (studentId) => {
        if (selectedDeskId) {
          const previousDesk = getDeskForStudent(studentId);
          const currentOccupant = currentSeating[selectedDeskId];

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[selectedDeskId] = studentId;

          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        setSelectedStudentId(selectedStudentId === studentId ? null : studentId);
      };

      const handleUnseat = (studentId, e) => {
        if (e) e.stopPropagation();
        const deskId = getDeskForStudent(studentId);
        if (deskId) {
          const updated = { ...currentSeating, [deskId]: null };
          updateSeating(updated);
        }
        if (selectedStudentId === studentId) setSelectedStudentId(null);
      };

      const getDeskStatus = (deskId, student) => {
        if (!student) return { status: 'empty' };
        const neighborIds = (ADJACENCY[deskId] || []).map(id => currentSeating[id]).filter(Boolean);
        const neighbors = neighborIds.map(id => studentMap[id]).filter(Boolean);
        const prefs = student.prefs || {};

        if (prefs.avoid && prefs.avoid.some(id => neighborIds.includes(id))) {
          return { status: 'red' };
        }

        if (prefs.backRow && !deskId.startsWith('r3')) return { status: 'red' };
        if (prefs.nearGroup && !['r3_1', 'r3_2', 'r2_1'].includes(deskId)) return { status: 'red' };
        if (prefs.nearDoor && !['d1', 'd2', 'r2_1'].includes(deskId)) return { status: 'red' };

        let isYellow = false;
        if (neighbors.length > 0) {
          const hasSameGender = neighbors.some(n => n.gender === student.gender);
          if (!hasSameGender) isYellow = true;
        }

        if (prefs.friends && prefs.friends.length > 0) {
          const friendNextTo = prefs.friends.some(id => neighborIds.includes(id));
          if (!friendNextTo) isYellow = true;
        }

        if (isYellow) return { status: 'yellow' };
        return { status: 'green' };
      };

      const handleGenerateSeating = () => {
        if (students.length === 0) return;

        const calculateScore = (testSeating) => {
          let score = 0;
          for (const deskId of ALL_DESK_IDS) {
            const sId = testSeating[deskId];
            if (!sId) continue;
            const student = studentMap[sId];
            if (!student) continue;

            const neighborIds = (ADJACENCY[deskId] || []).map(id => testSeating[id]).filter(Boolean);
            const prefs = student.prefs || {};

            if (prefs.avoid && prefs.avoid.some(id => neighborIds.includes(id))) {
              score -= 1000;
            }

            if (prefs.backRow) {
              if (deskId.startsWith('r3')) score += 60;
              else score -= 150;
            }
            if (prefs.nearGroup) {
              if (['r3_1', 'r3_2', 'r2_1'].includes(deskId)) score += 60;
              else score -= 150;
            }
            if (prefs.nearDoor) {
              if (['d1', 'd2', 'r2_1'].includes(deskId)) score += 60;
              else score -= 150;
            }

            if (prefs.friends && prefs.friends.length > 0) {
              const friendNextTo = prefs.friends.some(id => neighborIds.includes(id));
              if (friendNextTo) score += 40;
            }

            if (neighborIds.length > 0) {
              const sameGender = neighborIds.some(nId => studentMap[nId]?.gender === student.gender);
              if (sameGender) score += 20;
              else score -= 30;
            }
          }
          return score;
        };

        let bestSeating = null;
        let bestScore = -Infinity;

        for (let iteration = 0; iteration < 350; iteration++) {
          const shuffledStudents = [...students].sort(() => Math.random() - 0.5);
          const trialSeating = {};
          ALL_DESK_IDS.forEach((deskId, index) => {
            trialSeating[deskId] = shuffledStudents[index] ? shuffledStudents[index].id : null;
          });

          const currentScore = calculateScore(trialSeating);
          if (currentScore > bestScore) {
            bestScore = currentScore;
            bestSeating = trialSeating;
          }
        }

        if (bestSeating) {
          updateSeating(bestSeating);
          setSelectedDeskId(null);
          setSelectedStudentId(null);
        }
      };

      const formatStudentName = (name) => {
        if (!name) return { fontSize: 'text-xs' };
        if (name.length <= 6) return { fontSize: 'text-[13px] md:text-[14px] font-semibold' };
        if (name.length <= 9) return { fontSize: 'text-[11.5px] md:text-[12.5px] font-semibold leading-tight' };
        if (name.length <= 13) return { fontSize: 'text-[10px] md:text-[11px] font-semibold leading-tight' };
        return { fontSize: 'text-[9px] md:text-[10px] font-medium leading-tight' };
      };

      // SPARA MÅNAD: Sparar aktuell vy som ny månad och gör den aktiv direkt

        if (mName === 'Tom') {
          alert("Läget 'Tom' kan inte raderas.");
          return;
        }
        if (!confirm(`Vill du ta bort "${mName}"?`)) return;

        setAppData(prev => {
          const newMonths = { ...prev.classes[currentClass.id].months };
          delete newMonths[mName];
          return {
            ...prev,
            classes: {
              ...prev.classes,
              [currentClass.id]: {
                ...prev.classes[currentClass.id],
                activeMonth: currentMonth === mName ? 'Tom' : currentMonth,
                months: newMonths
              }
            }
          };
        });
      };

        if (oldName === 'Tom') {
          alert("Läget 'Tom' kan inte döpas om.");
          return;

        setAppData(prev => {
          const oldMonths = prev.classes[currentClass.id].months;

          Object.keys(oldMonths).forEach(m => {
            if (m === oldName) {
              updatedMonths[cleanName] = oldMonths[oldName];
            } else {
              updatedMonths[m] = oldMonths[m];
            }
          });

          return {
            ...prev,
            classes: {
              ...prev.classes,
              [currentClass.id]: {
                ...prev.classes[currentClass.id],
                activeMonth: currentMonth === oldName ? cleanName : currentMonth,

        setAppData(prev => ({

                      </button>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-1">
                      {students.map(s => (
                        <div
                          key={s.id}
                          onClick={() => setEditingStudentId(s.id)}
                          className={`
                            flex items-center justify-between p-2 rounded-lg cursor-pointer text-xs transition
                            ${editingStudentId === s.id ? 'bg-blue-100 border-blue-400 font-bold' : 'hover:bg-slate-100 border border-transparent'}
                          `}
                        >
                          <div className="flex items-center gap-1.5">
                            <span className={`w-2 h-2 rounded-full ${s.gender === 'F' ? 'bg-pink-400' : 'bg-blue-400'}`}></span>
                            <span>{s.name}</span>
                          </div>
                          <button
                            onClick={(e) => {
                              e.stopPropagation();
                              handleDeleteStudent(s.id);
                            }}
                            className="text-slate-400 hover:text-rose-600 text-xs px-1"
                          >
                            🗑️
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto pl-2">
                    {editingStudentId ? (() => {
                      const curStudent = studentMap[editingStudentId];
                      if (!curStudent) return null;
                      const prefs = curStudent.prefs || {};

                      return (
                        <div className="space-y-4">
                          <h4 className="font-bold text-sm text-slate-800 pb-2 border-b">
                            Anpassningar för {curStudent.name}
                          </h4>

                          <div>
                            <span className="block text-xs font-bold text-slate-600 mb-1.5">Särskilda behov i rummet:</span>
                            <div className="grid grid-cols-3 gap-2">
                              <label className="flex items-center gap-2 p-2 border rounded-lg bg-slate-50 cursor-pointer text-xs">
                                <input
                                  type="checkbox"
                                  checked={!!prefs.backRow}
                                  onChange={(e) => handleUpdateStudentPref(curStudent.id, 'backRow', e.target.checked)}
                                  className="rounded text-blue-600"
                                />
                                <span>Gärna bakre raden</span>
                              </label>

                              <label className="flex items-center gap-2 p-2 border rounded-lg bg-slate-50 cursor-pointer text-xs">
                                <input
                                  type="checkbox"
                                  checked={!!prefs.nearGroup}
                                  onChange={(e) => handleUpdateStudentPref(curStudent.id, 'nearGroup', e.target.checked)}
                                  className="rounded text-blue-600"
                                />
                                <span>Gärna nära grupprum</span>
                              </label>

                              <label className="flex items-center gap-2 p-2 border rounded-lg bg-slate-50 cursor-pointer text-xs">
                                <input
                                  type="checkbox"
                                  checked={!!prefs.nearDoor}
                                  onChange={(e) => handleUpdateStudentPref(curStudent.id, 'nearDoor', e.target.checked)}
                                  className="rounded text-blue-600"
                                />
                                <span>Gärna nära dörr</span>
                              </label>
                            </div>
                          </div>

                          <div>
                            <span className="block text-xs font-bold text-slate-600 mb-1">Får gärna sitta bredvid (önskemål):</span>
                            <div className="border rounded-lg p-2 max-h-36 overflow-y-auto grid grid-cols-2 gap-1 bg-slate-50 text-xs">
                              {students.filter(o => o.id !== curStudent.id).map(o => {
                                const isFriend = (prefs.friends || []).includes(o.id);
                                return (
                                  <label key={o.id} className="flex items-center gap-2 p-1 hover:bg-slate-100 rounded cursor-pointer">
                                    <input
                                      type="checkbox"
                                      checked={isFriend}
                                      onChange={(e) => {
                                        const curList = prefs.friends || [];
                                        const updated = e.target.checked
                                          ? [...curList, o.id]
                                          : curList.filter(id => id !== o.id);
                                        handleUpdateStudentPref(curStudent.id, 'friends', updated);
                                      }}
                                      className="rounded text-emerald-600"
                                    />
                                    <span className="truncate">{o.name}</span>
                                  </label>
                                );
                              })}
                            </div>
                          </div>

                          <div>
                            <span className="block text-xs font-bold text-rose-700 mb-1">Får INTE sitta bredvid (konfliktrisk):</span>
                            <div className="border border-rose-200 bg-rose-50/30 rounded-lg p-2 max-h-36 overflow-y-auto grid grid-cols-2 gap-1 text-xs">
                              {students.filter(o => o.id !== curStudent.id).map(o => {
                                const isAvoid = (prefs.avoid || []).includes(o.id);
                                return (
                                  <label key={o.id} className="flex items-center gap-2 p-1 hover:bg-rose-100/50 rounded cursor-pointer">
                                    <input
                                      type="checkbox"
                                      checked={isAvoid}
                                      onChange={(e) => {
                                        const curList = prefs.avoid || [];
                                        const updated = e.target.checked
                                          ? [...curList, o.id]
                                          : curList.filter(id => id !== o.id);
                                        handleUpdateStudentPref(curStudent.id, 'avoid', updated);
                                      }}
                                      className="rounded text-rose-600"
                                    />
                                    <span className="truncate">{o.name}</span>
                                  </label>
                                );
                              })}
                            </div>
                          </div>

                        </div>
                      );
                    })() : (
                      <div className="h-full flex items-center justify-center text-slate-400 text-xs italic">
                        Välj en elev till vänster för att redigera anpassningar.
                      </div>
                    )}
                  </div>

                </div>

                <div className="pt-3 border-t flex justify-end">
                  <button
                    onClick={() => {
                      handleSaveClassName();
                      setShowClassModal(false);
                      setEditingStudentId(null);
                    }}
                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg text-xs"
                  >
                    Klar
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL: SKAPA NY KLASS */}
          {showNewClassModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-5 max-w-xs w-full shadow-2xl">
                <h3 className="text-sm font-bold text-slate-800 mb-2">Skapa ny klass</h3>
                <input
                  type="text"
                  placeholder="Klassnamn..."
                  value={newClassName}
                  onChange={(e) => setNewClassName(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs mb-4 focus:ring-2 focus:ring-blue-500"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowNewClassModal(false)}
                    className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
                  >
                    Avbryt
                  </button>
                  <button
                    onClick={handleCreateClass}
                    className="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
                  >
                    Skapa klass
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

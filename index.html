    function App() {
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem('klassrum_app_data_v4');
          if (saved) return JSON.parse(saved);
        } catch (e) {
          console.error(e);
        }
        return INITIAL_DATA;
      });

      const [selectedDeskId, setSelectedDeskId] = useState(null);
      const [selectedStudentId, setSelectedStudentId] = useState(null);
      const [editingStudent, setEditingStudent] = useState(null);
      const [isPrintMode, setIsPrintMode] = useState(false);
      const [newMonthName, setNewMonthName] = useState('');
      const [showNewMonthModal, setShowNewMonthModal] = useState(false);
      const [showNewClassModal, setShowNewClassModal] = useState(false);
      const [newClassName, setNewClassName] = useState('');
      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('klassrum_app_data_v4', JSON.stringify(appData));
        } catch (e) {
          console.error(e);
        }
      }, [appData]);

      const currentClass = appData.classes[appData.activeClassId] || Object.values(appData.classes)[0];
      const currentMonth = currentClass.activeMonth;
      const currentSeating = currentClass.months[currentMonth] || {};
      const students = currentClass.students || [];

      const studentMap = useMemo(() => {
        const map = {};
        students.forEach(s => { map[s.id] = s; });
        return map;
      }, [students]);

      const girls = useMemo(() => students.filter(s => s.gender === 'F'), [students]);
      const boys = useMemo(() => students.filter(s => s.gender === 'P'), [students]);

      const getDeskForStudent = (studentId) => {
        for (const [deskId, sId] of Object.entries(currentSeating)) {
          if (sId === studentId) return deskId;
        }
        return null;
      };

      const updateSeating = (newSeatingMap) => {
        setAppData(prev => ({
          ...prev,
          classes: {
            ...prev.classes,
            [currentClass.id]: {
              ...prev.classes[currentClass.id],
              months: {
                ...prev.classes[currentClass.id].months,
                [currentMonth]: newSeatingMap
              }
            }
          }
        }));
      };

      // Uppdatera eller spara elev
      const saveStudent = (updatedStudent) => {
        setAppData(prev => {
          const classStudents = prev.classes[currentClass.id].students;
          const exists = classStudents.some(s => s.id === updatedStudent.id);
          const newStudents = exists
            ? classStudents.map(s => s.id === updatedStudent.id ? updatedStudent : s)
            : [...classStudents, updatedStudent];

          return {
            ...prev,
            classes: {
              ...prev.classes,
              [currentClass.id]: {
                ...prev.classes[currentClass.id],
                students: newStudents
              }
            }
          };
        });
        setEditingStudent(null);
      };

      // Radera elev
      const deleteStudent = (studentId) => {
        if (!confirm("Är du säker på att du vill ta bort denna elev ur klassen?")) return;
        setAppData(prev => {
          const newStudents = prev.classes[currentClass.id].students.filter(s => s.id !== studentId);
          // Rensa även bort från bänkar
          const newMonths = { ...prev.classes[currentClass.id].months };
          Object.keys(newMonths).forEach(m => {
            const seating = { ...newMonths[m] };
            Object.keys(seating).forEach(d => {
              if (seating[d] === studentId) seating[d] = null;
            });
            newMonths[m] = seating;
          });

          return {
            ...prev,
            classes: {
              ...prev.classes,
              [currentClass.id]: {
                ...prev.classes[currentClass.id],
                students: newStudents,
                months: newMonths
              }
            }
          };
        });
        if (selectedStudentId === studentId) setSelectedStudentId(null);
        setEditingStudent(null);
      };

      // Klickhanterare för bänkar
      const handleDeskClick = (deskId) => {
        if (selectedStudentId) {
          const currentOccupant = currentSeating[deskId];
          const previousDesk = getDeskForStudent(selectedStudentId);

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[deskId] = selectedStudentId;

          updateSeating(updated);
          setSelectedStudentId(null);
          setSelectedDeskId(null);
          return;
        }

        if (selectedDeskId) {
          if (selectedDeskId === deskId) {
            setSelectedDeskId(null);
            return;
          }
          const s1 = currentSeating[selectedDeskId] || null;
          const s2 = currentSeating[deskId] || null;

          const updated = { ...currentSeating, [selectedDeskId]: s2, [deskId]: s1 };
          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        setSelectedDeskId(deskId);
      };

      const handleStudentListClick = (studentId) => {
        if (selectedDeskId) {
          const previousDesk = getDeskForStudent(studentId);
          const currentOccupant = currentSeating[selectedDeskId];

          const updated = { ...currentSeating };
          if (previousDesk) {
            updated[previousDesk] = currentOccupant || null;
          }
          updated[selectedDeskId] = studentId;

          updateSeating(updated);
          setSelectedDeskId(null);
          return;
        }

        if (selectedStudentId === studentId) {
          setSelectedStudentId(null);
        } else {
          setSelectedStudentId(studentId);
        }
      };

      const handleUnseat = (studentId, e) => {
        if (e) e.stopPropagation();
        const deskId = getDeskForStudent(studentId);
        if (deskId) {
          const updated = { ...currentSeating, [deskId]: null };
          updateSeating(updated);
        }
        if (selectedStudentId === studentId) setSelectedStudentId(null);
      };

      // Statusberäkning
      const getDeskStatus = (deskId, student) => {
        if (!student) return { status: 'empty', reasons: [] };
        const neighborIds = (ADJACENCY[deskId] || []).map(id => currentSeating[id]).filter(Boolean);
        const neighbors = neighborIds.map(id => studentMap[id]).filter(Boolean);
        const prefs = student.prefs || {};
        const reasons = [];

        // Kollisioner
        if (prefs.avoid && prefs.avoid.some(id => neighborIds.includes(id))) {
          const avoidedNeighbors = prefs.avoid.filter(id => neighborIds.includes(id)).map(id => studentMap[id]?.name);
          reasons.push(`Sitter bredvid undvikna elever: ${avoidedNeighbors.join(', ')}`);
          return { status: 'red', reasons };
        }

        if (prefs.backRow && !deskId.startsWith('r3')) {
          reasons.push('Har behov av bakre raden');
          return { status: 'red', reasons };
        }
        if (prefs.nearGroup && !['r3_1', 'r3_2', 'r2_1'].includes(deskId)) {
          reasons.push('Har behov av plats nära grupprum');
          return { status: 'red', reasons };
        }
        if (prefs.nearDoor && !['d1', 'd2', 'r2_1'].includes(deskId)) {
          reasons.push('Har behov av plats nära dörr');
          return { status: 'red', reasons };
        }

        // Varningar (Gul)
        let isYellow = false;
        if (neighbors.length > 0) {
          const hasSameGender = neighbors.some(n => n.gender === student.gender);
          if (!hasSameGender) {
            reasons.push('Saknar bänkkamrat av samma kön');
            isYellow = true;
          }
        }

        if (prefs.friends && prefs.friends.length > 0) {
          const friendNextTo = prefs.friends.some(id => neighborIds.includes(id));
          if (!friendNextTo) {
            const friendNames = prefs.friends.map(id => studentMap[id]?.name).filter(Boolean);
            reasons.push(`Sitter inte bredvid önskade vänner (${friendNames.join(', ')})`);
            isYellow = true;
          }
        }

        if (isYellow) return { status: 'yellow', reasons };
        return { status: 'green', reasons: ['Alla regler och anpassningar uppfylls!'] };
      };

      const formatStudentName = (name) => {
        if (!name) return { text: '', fontSize: 'text-xs' };
        if (name.length <= 6) return { text: name, fontSize: 'text-sm font-semibold' };
        if (name.length <= 9) return { text: name, fontSize: 'text-xs font-semibold' };
        if (name.length <= 13) return { text: name, fontSize: 'text-[10px] font-semibold leading-tight' };
        return { text: name, fontSize: 'text-[9px] font-medium leading-tight' };
      };

      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `klassrum_backup_${appData.activeClassId}.json`);

                          onChange={(e) => setEditingStudent({
                            ...editingStudent,
                            prefs: { ...editingStudent.prefs, nearGroup: e.target.checked }
                          })}
                          className="rounded text-blue-600"
                        />
                        <span>Nära grupprum</span>
                      </label>

                      <label className="flex items-center gap-2 p-2 border rounded-lg bg-slate-50 cursor-pointer text-xs">
                        <input
                          type="checkbox"
                          checked={!!editingStudent.prefs?.nearDoor}
                          onChange={(e) => setEditingStudent({
                            ...editingStudent,
                            prefs: { ...editingStudent.prefs, nearDoor: e.target.checked }
                          })}
                          className="rounded text-blue-600"
                        />
                        <span>Nära dörr</span>
                      </label>
                    </div>
                  </div>

                  {/* Sitter gärna bredvid */}
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">
                      Får gärna sitta bredvid (önskemål)
                    </label>
                    <div className="border border-slate-200 rounded-lg p-2 max-h-32 overflow-y-auto grid grid-cols-2 gap-1 bg-slate-50 text-xs">
                      {students.filter(s => s.id !== editingStudent.id).map(other => {
                        const isFriend = editingStudent.prefs?.friends?.includes(other.id);
                        return (
                          <label key={other.id} className="flex items-center gap-1.5 p-1 rounded hover:bg-slate-100 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={!!isFriend}
                              onChange={(e) => {
                                const currentFriends = editingStudent.prefs?.friends || [];
                                const newFriends = e.target.checked
                                  ? [...currentFriends, other.id]
                                  : currentFriends.filter(id => id !== other.id);
                                setEditingStudent({
                                  ...editingStudent,
                                  prefs: { ...editingStudent.prefs, friends: newFriends }
                                });
                              }}
                              className="rounded text-emerald-600"
                            />
                            <span className="truncate">{other.name}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>

                  {/* Får INTE sitta bredvid */}
                  <div>
                    <label className="block text-xs font-bold text-rose-700 mb-1">
                      Får INTE sitta bredvid (konfliktrisk / förbud)
                    </label>
                    <div className="border border-rose-200 bg-rose-50/30 rounded-lg p-2 max-h-32 overflow-y-auto grid grid-cols-2 gap-1 text-xs">
                      {students.filter(s => s.id !== editingStudent.id).map(other => {
                        const isAvoid = editingStudent.prefs?.avoid?.includes(other.id);
                        return (
                          <label key={other.id} className="flex items-center gap-1.5 p-1 rounded hover:bg-rose-100/50 cursor-pointer">
                            <input
                              type="checkbox"
                              checked={!!isAvoid}
                              onChange={(e) => {
                                const currentAvoid = editingStudent.prefs?.avoid || [];
                                const newAvoid = e.target.checked
                                  ? [...currentAvoid, other.id]
                                  : currentAvoid.filter(id => id !== other.id);
                                setEditingStudent({
                                  ...editingStudent,
                                  prefs: { ...editingStudent.prefs, avoid: newAvoid }
                                });
                              }}
                              className="rounded text-rose-600"
                            />
                            <span className="truncate">{other.name}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-4 border-t mt-4">
                  {students.some(s => s.id === editingStudent.id) ? (
                    <button
                      onClick={() => deleteStudent(editingStudent.id)}
                      className="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2 py-1"
                    >
                      Ta bort elev ur klassen
                    </button>
                  ) : <div></div>}

                  <div className="flex gap-2">
                    <button
                      onClick={() => setEditingStudent(null)}
                      className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
                    >
                      Avbryt
                    </button>
                    <button
                      onClick={() => saveStudent(editingStudent)}
                      className="px-4 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold"
                    >
                      Spara ändringar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: SPARA NY MÅNAD */}
          {showNewMonthModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-5 max-w-sm w-full shadow-2xl">
                <h3 className="text-base font-bold text-slate-800 mb-2">Spara aktuell placering</h3>
                <p className="text-xs text-slate-500 mb-4">Ange namn på perioden (t.ex. "Oktober 2026").</p>
                <input
                  type="text"
                  placeholder="Månadens namn..."
                  value={newMonthName}
                  onChange={(e) => setNewMonthName(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4 focus:ring-2 focus:ring-blue-500"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowNewMonthModal(false)}
                    className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
                  >
                    Avbryt
                  </button>
                  <button
                    onClick={handleCreateMonth}
                    className="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
                  >
                    Spara månad
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL: SKAPA NY KLASS */}
          {showNewClassModal && (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl p-5 max-w-sm w-full shadow-2xl">
                <h3 className="text-base font-bold text-slate-800 mb-2">Skapa ny klass</h3>
                <input
                  type="text"
                  placeholder="Klassnamn (t.ex. 9A)..."
                  value={newClassName}
                  onChange={(e) => setNewClassName(e.target.value)}
                  className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4 focus:ring-2 focus:ring-blue-500"
                />
                <div className="flex justify-end gap-2">
                  <button
                    onClick={() => setShowNewClassModal(false)}
                    className="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg font-medium"
                  >
                    Avbryt
                  </button>
                  <button
                    onClick={handleCreateClass}
                    className="px-3 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold"
                  >
                    Skapa klass
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
